services:
  api:
    build: .
    image: expense-tracker-api
    ports:
      - 8080:8080
    networks:
      - appnet
    depends_on:
      - db
    env_file:
      - .env
    

  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idbeholdv -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: idbeholdv
      POSTGRES_DB: expense_tracker
    volumes:
      - appvolume:/var/lib/postgresql/data
    networks:
      - appnet

networks:
  appnet:

volumes:
  appvolume:
  

